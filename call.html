<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>通話 録音・AI要約ツール</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: light; }
  body { font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif; }
  @keyframes pulse-rec { 0%,100%{opacity:1} 50%{opacity:.35} }
  .rec-dot { animation: pulse-rec 1.1s ease-in-out infinite; }
  @keyframes ringpulse { 0%,100%{box-shadow:0 0 0 0 rgba(79,70,229,.5)} 50%{box-shadow:0 0 0 6px rgba(79,70,229,0)} }
  .next-btn { animation: ringpulse 1.6s ease-in-out infinite; }
  .nice-scroll::-webkit-scrollbar { width: 8px; }
  .nice-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid #c7d2fe; border-top-color:#4f46e5; border-radius:50%; animation: spin .8s linear infinite; vertical-align:-2px; }
</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen text-sm">

<!-- マイク許可オーバーレイ -->
<div id="startOverlay" class="hidden fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl p-6 max-w-sm text-center shadow-xl">
    <div class="text-3xl mb-2">🎙️</div>
    <p class="font-bold mb-1">マイクの使用を許可してください</p>
    <p class="text-slate-500 mb-4 text-xs">開いている間ずっと待機します。開始するにはマイクを許可してください（初回のみ）。</p>
    <button id="overlayStartBtn" class="px-5 py-2.5 rounded-lg bg-emerald-600 text-white font-semibold hover:bg-emerald-700">▶ 待機を開始</button>
    <p id="overlayError" class="text-xs text-rose-500 mt-3 hidden"></p>
  </div>
</div>

<div class="max-w-4xl mx-auto p-3 sm:p-4">

  <!-- 上段：担当者＋ステータス＋メーター -->
  <div class="flex flex-wrap items-center gap-x-4 gap-y-2 mb-3">
    <div class="flex items-center gap-2">
      <span class="text-xs font-semibold text-slate-500">担当者</span>
      <select id="agentSelect" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm bg-white font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-400">
        <option value="">選択</option>
      </select>
      <a id="mySheetLink" href="#" target="_blank" rel="noopener" class="hidden text-xs text-emerald-700 hover:underline font-semibold whitespace-nowrap">📄 シートを開く ↗</a>
    </div>
    <div id="statusPill" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-500">
      <span class="w-2.5 h-2.5 rounded-full bg-slate-300"></span><span id="statusText">停止中</span>
    </div>
    <span id="channelInfo" class="text-xs font-semibold text-slate-400"></span>
    <div class="flex-1 min-w-[220px] grid grid-cols-2 gap-3">
      <div>
        <div class="flex justify-between text-[10px] text-slate-500"><span>自分(L)</span><span id="levelLText">0%</span></div>
        <div class="h-1.5 bg-slate-200 rounded-full overflow-hidden"><div id="levelL" class="h-full bg-sky-500" style="width:0%"></div></div>
      </div>
      <div>
        <div class="flex justify-between text-[10px] text-slate-500"><span>相手(R)</span><span id="levelRText">0%</span></div>
        <div class="h-1.5 bg-slate-200 rounded-full overflow-hidden"><div id="levelR" class="h-full bg-amber-500" style="width:0%"></div></div>
      </div>
    </div>
  </div>

  <!-- メインカード -->
  <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 space-y-3">

    <!-- マイク選択 -->
    <div class="flex items-end gap-2">
      <div class="flex-1">
        <label class="block text-xs font-semibold text-slate-500 mb-1">マイク（入力デバイス）</label>
        <select id="deviceSelect" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-400">
          <option value="">（権限取得後に表示）</option>
        </select>
      </div>
      <button id="refreshDevices" title="更新" class="px-3 py-2 border border-slate-300 rounded-lg hover:bg-slate-50">↻</button>
    </div>

    <!-- 通話状態バナー -->
    <div id="callBanner" class="rounded-lg border px-4 py-3 text-sm font-semibold bg-slate-50 border-slate-200 text-slate-600">
      電話を取ったら「▶ 通話開始」を押してください（押した時点から録音を開始します）。
    </div>

    <!-- ボタン群 -->
    <div class="flex flex-wrap gap-2 items-center pt-1">
      <button id="startCallBtn" class="px-5 py-3 rounded-lg bg-emerald-600 text-white font-bold text-base hover:bg-emerald-700 active:scale-95 transition">▶ 通話開始</button>
      <button id="endCallBtn" class="px-5 py-3 rounded-lg bg-indigo-600 text-white font-bold text-base hover:bg-indigo-700 active:scale-95 transition">📞 電話終了</button>
      <span class="flex-1"></span>
      <button id="pauseBtn" class="px-4 py-2.5 rounded-lg bg-rose-500 text-white font-semibold hover:bg-rose-600 active:scale-95 transition">⏸ 一時停止</button>
      <button id="clearBtn" class="px-4 py-2.5 rounded-lg bg-white border border-slate-300 text-slate-500 font-semibold hover:bg-slate-50 active:scale-95 transition">🗑 クリア</button>
      <span id="toast" class="text-sm font-semibold self-center opacity-0 transition-opacity"></span>
    </div>

    <!-- 録音一覧（1週間保存。要約・文字起こしもここに表示） -->
    <div>
      <label class="block text-sm font-semibold text-slate-600 mb-2">🎧 録音データ（クリックで要約・文字起こしを表示 ／ このパソコン内に1週間保存 → 自動削除）</label>
      <div id="aiStatus" class="hidden mb-1 text-sm font-semibold text-indigo-600"><span class="spinner"></span> AIが録音音声を解析しています…（通話の長さにより数十秒かかります）</div>
      <div id="recList" class="space-y-1"></div>
    </div>
  </section>

  <footer class="text-center text-xs text-slate-400 mt-4">Chrome / Edge で動作 ・ <a href="index.html" class="text-emerald-700 hover:underline">← ネオOMナビへ戻る</a></footer>
</div>

<script>
/* ===== 設定 ===== */
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxVvYJ0QD0McQtiitEebL7bmBPyUVmohOeCw9RmYzpZeiy2_lrtQ-5quDoD-_M-kfHg/exec';
const AGENTS = ['石田','戸塚','根木','水野','村松','藤森','河西','鈴木'];
const MAX_AUDIO_MB = 14;               // これを超える録音はAI解析せずフォールバック(Gemini/GASの受信上限対策。32kbpsで約1時間分)
const MIN_AUDIO_MS = 8000;             // これより短い録音はAIに送らない(短すぎるとAIが内容を創作するため)
const LONG_AUDIO_MS = 10*60*1000;      // これより長い録音はAI解析に時間がかかるため確認する
const REC_KEEP_MS = 7*24*60*60*1000;   // 録音の保存期間: 1週間

const state = {
  audioContext:null, mediaStream:null, source:null, splitter:null,
  analyserL:null, analyserR:null, recognition:null,
  shouldListen:false, recognitionRunning:false, rafId:null,
  callActive:false,
  transcript:[], callStartAt:null, lastRowUrl:'',
  activeSeg:null, recErr:'', recDiag:'',   // 通話中の録音と、失敗時の原因メモ
  summaryText:'', transcriptAI:'', parsed:null, lastCall:null, pendingSave:false,
  energyL:0, energyR:0, timerId:null,
};
const $ = (id) => document.getElementById(id);

const deviceSelect=$('deviceSelect'), startCallBtn=$('startCallBtn'), endCallBtn=$('endCallBtn'),
  pauseBtn=$('pauseBtn'), clearBtn=$('clearBtn'),
  agentSelect=$('agentSelect'), mySheetLink=$('mySheetLink'),
  startOverlay=$('startOverlay'), overlayStartBtn=$('overlayStartBtn'), overlayError=$('overlayError'),
  statusText=$('statusText'), statusPill=$('statusPill'),
  levelL=$('levelL'), levelR=$('levelR'), levelLText=$('levelLText'), levelRText=$('levelRText'),
  aiStatus=$('aiStatus'), recList=$('recList'), callBanner=$('callBanner');

/* ===== 担当者プルダウン ===== */
AGENTS.forEach(n => { const o=document.createElement('option'); o.value=n; o.textContent=n; agentSelect.appendChild(o); });
agentSelect.value = localStorage.getItem('agentName') || '';
agentSelect.addEventListener('change', () => {
  localStorage.setItem('agentName', agentSelect.value); refreshMySheetLink();
  if(state.pendingSave && agentSelect.value){ state.pendingSave=false; saveHistory(); }
});

async function listDevices(){
  try{
    const devices = await navigator.mediaDevices.enumerateDevices();
    const inputs = devices.filter(d=>d.kind==='audioinput');
    const prev = deviceSelect.value;
    deviceSelect.innerHTML='';
    if(!inputs.length){ deviceSelect.innerHTML='<option value="">入力デバイスなし</option>'; return; }
    inputs.forEach((d,i)=>{ const o=document.createElement('option'); o.value=d.deviceId; o.textContent=d.label||('マイク '+(i+1)); deviceSelect.appendChild(o); });
    if(prev) deviceSelect.value=prev;
  }catch(e){ console.error(e); }
}

function setStatus(mode){
  const map={ idle:['停止中','bg-slate-300','text-slate-500'],
    standby:['待機中','bg-emerald-500','text-emerald-600'],
    call:['通話中(録音中)','bg-red-500 rec-dot','text-red-600'],
    paused:['一時停止中','bg-yellow-400','text-yellow-600'], error:['エラー','bg-red-500','text-red-600'] };
  const a=map[mode]||map.idle; statusText.textContent=a[0]; statusText.className=a[2]; statusPill.querySelector('span').className='w-2.5 h-2.5 rounded-full '+a[1];
}
function refreshStatus(){ setStatus(state.shouldListen ? (state.callActive?'call':'standby') : 'paused'); }
function updateChannelInfo(ch){
  const el=$('channelInfo');
  if(ch>=2){ el.textContent='入力：'+ch+'ch(通話アダプタ)'; el.className='text-xs font-semibold text-emerald-600'; }
  else if(ch===1){ el.textContent='入力：1ch(PCマイク)'; el.className='text-xs font-semibold text-amber-600'; }
  else el.textContent='';
}
function fmtElapsed(ms){ const s=Math.floor(ms/1000); return Math.floor(s/60)+':' + ('0'+s%60).slice(-2); }
function updateBanner(){
  if(state.callActive){
    const el=fmtElapsed(Date.now()-state.callStartAt.getTime());
    callBanner.className='rounded-lg border px-4 py-3 text-sm font-semibold bg-red-50 border-red-200 text-red-600';
    callBanner.innerHTML='🔴 通話中 '+el+'（録音しています。終わったら「📞 電話終了」）';
  } else {
    callBanner.className='rounded-lg border px-4 py-3 text-sm font-semibold bg-slate-50 border-slate-200 text-slate-600';
    callBanner.textContent='電話を取ったら「▶ 通話開始」を押してください（押した時点から録音を開始します）。';
  }
  startCallBtn.classList.toggle('hidden', state.callActive);
  startCallBtn.classList.toggle('next-btn', !state.callActive && state.shouldListen);
  endCallBtn.classList.toggle('hidden', !state.callActive);
  endCallBtn.classList.toggle('next-btn', state.callActive);
}

async function buildAudioGraph(deviceId){
  const constraints={ audio:{ deviceId:deviceId?{exact:deviceId}:undefined, channelCount:2, echoCancellation:false, noiseSuppression:false, autoGainControl:false }, video:false };
  state.mediaStream=await navigator.mediaDevices.getUserMedia(constraints);
  await listDevices();
  state.audioContext=new (window.AudioContext||window.webkitAudioContext)();
  if(state.audioContext.state==='suspended') await state.audioContext.resume();
  state.source=state.audioContext.createMediaStreamSource(state.mediaStream);
  const ch=state.mediaStream.getAudioTracks()[0].getSettings().channelCount; updateChannelInfo(ch);
  state.splitter=state.audioContext.createChannelSplitter(2); state.source.connect(state.splitter);
  state.analyserL=state.audioContext.createAnalyser(); state.analyserR=state.audioContext.createAnalyser();
  state.analyserL.fftSize=1024; state.analyserR.fftSize=1024;
  state.splitter.connect(state.analyserL,0); state.splitter.connect(state.analyserR,1);
}

/* ===== 録音(「通話開始」を押してから「電話終了」までを1本で録る) ===== */
function streamAlive(){
  if(!state.mediaStream || !state.mediaStream.getAudioTracks) return false;
  const t=state.mediaStream.getAudioTracks()[0];
  return !!t && t.readyState==='live';
}
function newSeg(){
  if(!window.MediaRecorder){ state.recErr='このブラウザは録音に未対応です(Chrome/Edgeをお使いください)'; return null; }
  if(!streamAlive()){ state.recErr='マイクが使える状態ではありません'; return null; }
  try{
    const seg={chunks:[], startedAt:Date.now(), rec:null};
    const opt = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? {mimeType:'audio/webm;codecs=opus', audioBitsPerSecond:32000} : {};
    seg.rec=new MediaRecorder(state.mediaStream, opt);
    seg.rec.ondataavailable=function(e){ if(e.data && e.data.size) seg.chunks.push(e.data); };
    seg.rec.onerror=function(e){ console.warn('録音エラー:', e); state.recErr='録音中にエラーが発生しました'; };
    seg.rec.start(1000);
    state.recErr='';
    return seg;
  }catch(e){ console.warn('録音開始失敗:', e); state.recErr='録音を開始できませんでした('+(e.name||e.message||e)+')'; return null; }
}
function discardSeg(seg){ if(!seg) return; try{ if(seg.rec && seg.rec.state!=='inactive') seg.rec.stop(); }catch(e){} seg.chunks=[]; }
function stopActiveAndGetBlob(){
  return new Promise(function(resolve){
    const seg=state.activeSeg; state.activeSeg=null;
    if(!seg){ state.lastDurationMs=0; state.recDiag=state.recErr||'録音が開始されていませんでした'; resolve(null); return; }
    state.lastDurationMs=Date.now()-seg.startedAt;   // 録音の長さ
    const done=function(){
      state.recDiag=seg.chunks.length?'':(state.recErr||'音声データが空でした(録音時間'+Math.round(state.lastDurationMs/1000)+'秒)');
      resolve(seg.chunks.length?new Blob(seg.chunks,{type:'audio/webm'}):null);
    };
    if(!seg.rec || seg.rec.state==='inactive'){ done(); return; }
    seg.rec.onstop=done;
    try{ seg.rec.requestData(); }catch(e){}   // 直近ぶんを確実に書き出す
    try{ seg.rec.stop(); }catch(e){ done(); }
  });
}
function blobToBase64(blob){
  return new Promise(function(resolve,reject){
    const r=new FileReader();
    r.onload=function(){ resolve(String(r.result).split(',')[1]); };
    r.onerror=reject;
    r.readAsDataURL(blob);
  });
}

/* ===== 録音の1週間保存(IndexedDB=ブラウザ内データベース) ===== */
function openRecDb(){
  return new Promise(function(resolve,reject){
    const req=indexedDB.open('callRecordings',1);
    req.onupgradeneeded=function(){ req.result.createObjectStore('recs',{keyPath:'id',autoIncrement:true}); };
    req.onsuccess=function(){ resolve(req.result); };
    req.onerror=function(){ reject(req.error); };
  });
}
async function saveRecording(blob){
  let id=null;
  try{
    const db=await openRecDb();
    id=await new Promise(function(resolve,reject){
      const tx=db.transaction('recs','readwrite');
      const req=tx.objectStore('recs').add({at:Date.now(), size:blob.size, dur:state.lastDurationMs||0, blob:blob, summary:'', transcript:''});
      req.onsuccess=function(){ resolve(req.result); };
      tx.onerror=function(){ reject(tx.error); };
    });
  }catch(e){ console.warn('録音保存失敗:', e); }
  renderRecList();
  return id;
}
/* あとからAI要約・文字起こしを録音レコードに紐づける */
async function updateRecording(id, fields){
  if(id==null) return;
  try{
    const db=await openRecDb();
    await new Promise(function(resolve){
      const tx=db.transaction('recs','readwrite');
      const st=tx.objectStore('recs');
      st.get(id).onsuccess=function(e){
        const v=e.target.result;
        if(v){ Object.assign(v, fields); st.put(v); }
      };
      tx.oncomplete=resolve; tx.onerror=resolve;
    });
  }catch(e){}
  renderRecList();
}
async function purgeOldRecordings(){
  try{
    const db=await openRecDb();
    const cutoff=Date.now()-REC_KEEP_MS;
    await new Promise(function(resolve){
      const tx=db.transaction('recs','readwrite');
      const st=tx.objectStore('recs');
      st.openCursor().onsuccess=function(e){
        const cur=e.target.result;
        if(cur){ if(cur.value.at<cutoff) cur.delete(); cur.continue(); }
      };
      tx.oncomplete=resolve; tx.onerror=resolve;
    });
  }catch(e){}
}
function listRecordings(){
  return openRecDb().then(function(db){
    return new Promise(function(resolve){
      const out=[];
      const tx=db.transaction('recs','readonly');
      tx.objectStore('recs').openCursor().onsuccess=function(e){
        const cur=e.target.result;
        if(cur){ out.push({id:cur.key, at:cur.value.at, size:cur.value.size, dur:cur.value.dur||0, blob:cur.value.blob, summary:cur.value.summary||'', transcript:cur.value.transcript||'', url:cur.value.url||''}); cur.continue(); }
        else resolve(out);
      };
      tx.onerror=function(){ resolve(out); };
    });
  }).catch(function(){ return []; });
}
async function deleteRecording(id){
  try{
    const db=await openRecDb();
    await new Promise(function(resolve){
      const tx=db.transaction('recs','readwrite');
      tx.objectStore('recs').delete(id);
      tx.oncomplete=resolve; tx.onerror=resolve;
    });
  }catch(e){}
  await renderRecList();
}
function fmtDate(ms){ return new Date(ms).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
function fmtDur(ms){ if(!ms) return '—'; const s=Math.round(ms/1000); return Math.floor(s/60)+'分'+('0'+s%60).slice(-2)+'秒'; }
/* 開いている録音のID(再描画しても開いたままにする) */
const openIds={};
function openDetail(id){
  if(id==null) return;
  openIds[id]=1;
  const d=recList.querySelector('[data-detail="'+id+'"]');
  if(d) d.classList.remove('hidden');
}
function toggleDetail(id){
  const d=recList.querySelector('[data-detail="'+id+'"]');
  if(!d) return;
  const willOpen=d.classList.contains('hidden');
  d.classList.toggle('hidden');
  if(willOpen) openIds[id]=1; else delete openIds[id];
}
async function renderRecList(){
  const recs=(await listRecordings()).sort(function(a,b){ return b.at-a.at; });
  if(!recs.length){ recList.innerHTML='<p class="text-sm text-slate-400">録音はまだありません。「電話終了」ごとにここへ保存されます。</p>'; return; }
  const btn='px-3 py-2 rounded-lg bg-white border border-slate-300 hover:bg-slate-100 text-sm font-semibold';
  recList.innerHTML=recs.map(function(r){
    const escH=function(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});};
    const title=(r.summary||'').split('\n')[0].replace(/^[・\-\*\s]+/,'');
    return '<div class="border border-slate-200 rounded-lg bg-slate-50 text-sm" data-rec="'+r.id+'">'+
      '<div class="flex items-center gap-4 px-4 py-3 cursor-pointer hover:bg-slate-100 rounded-lg" data-toggle="'+r.id+'" title="クリックで要約・文字起こしを表示/非表示">'+
        '<span class="font-semibold text-slate-700 whitespace-nowrap">'+fmtDate(r.at)+'</span>'+
        '<span class="text-slate-500 whitespace-nowrap">'+fmtDur(r.dur)+'</span>'+
        (title?'<span class="text-slate-700 font-semibold truncate">'+escH(title)+'</span>':'')+
        '<span class="flex-1"></span>'+
        '<button data-copy="'+r.id+'" class="'+btn+'">📋 テキストコピー</button>'+
        '<button data-play="'+r.id+'" class="'+btn+'">▶ 再生</button>'+
        '<button data-dl="'+r.id+'" class="'+btn+'">🎵 音声保存</button>'+
        '<button data-del="'+r.id+'" class="px-3 py-2 rounded-lg bg-white border border-slate-300 text-rose-500 hover:bg-rose-50 text-base" title="削除">🗑</button>'+
      '</div>'+
      '<div class="'+(openIds[r.id]?'':'hidden ')+'border-t border-slate-200 px-4 py-3 space-y-3" data-detail="'+r.id+'">'+
        '<div><div class="font-semibold text-slate-500 mb-1 text-xs">要約</div><div class="whitespace-pre-wrap leading-relaxed text-slate-700">'+(r.summary?escH(r.summary):'（要約なし）')+'</div></div>'+
        '<div><div class="font-semibold text-slate-500 mb-1 text-xs">文字起こし</div><div class="whitespace-pre-wrap leading-relaxed text-slate-600 max-h-56 overflow-y-auto nice-scroll">'+(r.transcript?escH(r.transcript):'（文字起こしなし）')+'</div></div>'+
      '</div>'+
      '</div>';
  }).join('');
}
recList.addEventListener('click', async function(ev){
  const b=ev.target.closest('button');
  if(!b){
    // 行クリックで要約・文字起こしを開閉
    const row=ev.target.closest('[data-toggle]');
    if(row) toggleDetail(row.dataset.toggle);
    return;
  }
  const recs=await listRecordings();
  if(b.dataset.copy){
    const r=recs.find(function(x){ return x.id==b.dataset.copy; });
    if(!r||!r.summary){ showToast('この録音には要約がありません', true); return; }
    await clip(buildCopyText(r));
    showToast('テキストをコピーしました');
  } else if(b.dataset.play){
    const r=recs.find(function(x){ return x.id==b.dataset.play; }); if(!r) return;
    const row=b.closest('[data-rec]');
    const old=row.querySelector('audio'); if(old){ old.remove(); return; }
    const a=document.createElement('audio'); a.controls=true; a.autoplay=true; a.className='h-8 max-w-[240px]';
    a.src=URL.createObjectURL(r.blob); row.appendChild(a);
  } else if(b.dataset.dl){
    const r=recs.find(function(x){ return x.id==b.dataset.dl; }); if(!r) return;
    const a=document.createElement('a'); a.href=URL.createObjectURL(r.blob);
    a.download='通話録音_'+new Date(r.at).toLocaleString('ja-JP').replace(/[\/\s:]/g,'-')+'.webm';
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
  } else if(b.dataset.del){
    deleteRecording(Number(b.dataset.del));
  }
});

function rms(a){ const b=new Uint8Array(a.fftSize); a.getByteTimeDomainData(b); let s=0; for(let i=0;i<b.length;i++){const v=(b[i]-128)/128; s+=v*v;} return Math.sqrt(s/b.length); }
function meterLoop(){
  if(!state.analyserL) return;
  const l=rms(state.analyserL), r=rms(state.analyserR);
  state.energyL+=l; state.energyR+=r;
  levelL.style.width=Math.min(100,Math.round(l*280))+'%'; levelR.style.width=Math.min(100,Math.round(r*280))+'%';
  levelLText.textContent=Math.min(100,Math.round(l*280))+'%'; levelRText.textContent=Math.min(100,Math.round(r*280))+'%';
  state.rafId=requestAnimationFrame(meterLoop);
}
function stopMeters(){ if(state.rafId) cancelAnimationFrame(state.rafId); state.rafId=null; levelL.style.width='0%'; levelR.style.width='0%'; levelLText.textContent='0%'; levelRText.textContent='0%'; }

/* ===== 文字起こし(裏方: 画面表示なし。AI失敗時の簡易要約とシート保存用) ===== */
function initRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return null;   // 未対応でも録音・AI要約は動く
  const rec=new SR(); rec.lang='ja-JP'; rec.continuous=true; rec.interimResults=false; rec.maxAlternatives=1;
  rec.onstart=function(){ state.recognitionRunning=true; };
  rec.onresult=function(e){
    for(let i=e.resultIndex;i<e.results.length;i++){
      const res=e.results[i];
      if(res.isFinal) commitFinal(res[0].transcript.trim());
    }
  };
  rec.onerror=function(e){
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){ state.shouldListen=false; }
    else console.warn('recognition error（自動回復）:', e.error);
  };
  rec.onend=function(){ state.recognitionRunning=false; if(recognitionWanted()) setTimeout(safeStartRecognition,250); };
  return rec;
}
/* 文字起こしは通話中だけ動かす(周囲の雑談を拾わないため) */
function recognitionWanted(){ return state.shouldListen && state.callActive; }
function safeStartRecognition(){ if(!state.recognition||state.recognitionRunning||!recognitionWanted()) return; try{ state.recognition.start(); }catch(e){} }
function stopRecognition(){ if(state.recognition){ try{ state.recognition.stop(); }catch(e){} } }
function currentSide(){
  const l=state.energyL, r=state.energyR;
  if(l+r<0.01) return 'R';
  return (l>r*1.3) ? 'L' : 'R';
}
function commitFinal(text){
  if(!text || !state.callActive) return;
  state.transcript.push({text:text, side:currentSide()});
  state.energyL=0; state.energyR=0;
}
function transcriptText(list){
  return (list||state.transcript).map(function(t){ return (t.side==='L'?'自分: ':'相手: ')+t.text; }).join('\n');
}

/* ===== 通話開始(ボタン) ===== */
async function activateCall(){
  if(state.callActive) return;
  // マイクが未取得/切断されている場合は取り直してから始める(録音なしで通話が進むのを防ぐ)
  if(!streamAlive()){
    showToast('マイクを準備しています…');
    try{
      try{ state.audioContext && state.audioContext.close(); }catch(e){}
      state.audioContext=null; state.mediaStream=null; state.recognition=null;
      await buildAudioGraph(deviceSelect.value);
      state.shouldListen=true; meterLoop();
    }catch(e){
      showToast('マイクを準備できませんでした。マイクの許可と接続を確認してください', true);
      showOverlay('マイクを使用できません。アドレスバーの🔒から許可を確認してください。');
      return;
    }
  }
  state.callActive=true;
  state.callStartAt=new Date();
  state.transcript=[];
  state.activeSeg=newSeg();   // ここから録音開始(電話終了まで1本で録る)
  if(!state.activeSeg) showToast('⚠ '+(state.recErr||'録音を開始できませんでした'), true);
  state.recognition=state.recognition||initRecognition();
  safeStartRecognition();
  if(state.timerId) clearInterval(state.timerId);
  state.timerId=setInterval(updateBanner, 1000);
  refreshStatus(); updateBanner();
}

async function startListening(){
  if(!state.audioContext){ await buildAudioGraph(deviceSelect.value); }
  else if(state.audioContext.state==='suspended') await state.audioContext.resume();
  state.shouldListen=true; meterLoop();
  refreshStatus(); updateBanner();
  pauseBtn.textContent='⏸ 一時停止'; pauseBtn.className='px-4 py-2.5 rounded-lg bg-rose-500 text-white font-semibold hover:bg-rose-600 active:scale-95 transition';
}
function pauseCall(){
  state.shouldListen=false;
  stopRecognition();
  if(state.activeSeg){ try{ if(state.activeSeg.rec.state==='recording') state.activeSeg.rec.pause(); }catch(e){} }
  if(state.audioContext && state.audioContext.state==='running') state.audioContext.suspend();
  stopMeters(); setStatus('paused'); updateBanner();
  pauseBtn.textContent='▶ 待機再開'; pauseBtn.className='px-4 py-2.5 rounded-lg bg-emerald-600 text-white font-semibold hover:bg-emerald-700 active:scale-95 transition';
}
function resumeAll(){
  if(state.activeSeg){ try{ if(state.activeSeg.rec.state==='paused') state.activeSeg.rec.resume(); }catch(e){} }
}
function togglePause(){ if(state.shouldListen) pauseCall(); else { resumeAll(); autoStart(); } }
function showOverlay(msg){ startOverlay.classList.remove('hidden'); if(msg){ overlayError.textContent=msg; overlayError.classList.remove('hidden'); } else overlayError.classList.add('hidden'); }
function hideOverlay(){ startOverlay.classList.add('hidden'); overlayError.classList.add('hidden'); }
async function autoStart(){
  try{ await startListening(); if(state.audioContext && state.audioContext.state!=='running'){ showOverlay('「待機を開始」を押してください。'); return; } hideOverlay(); }
  catch(e){ const denied=e&&(e.name==='NotAllowedError'||e.name==='SecurityError'); showOverlay(denied?'マイクがブロックされています。アドレスバーの🔒から許可してください。':''); setStatus('error'); }
}

/* ===== 電話終了 = 録音確定→AI解析→自動履歴保存、待機へ戻る ===== */
function parseSummary(text){
  const lines=text.split('\n').map(function(l){ return l.replace(/^[・\-\*\s]+/,'').trim(); }).filter(Boolean);
  const p={ title: lines[0]||'', name: lines[1]||'', phone: lines[2]||'', company: lines[3]||'', code: lines[4]||'', bullets: lines.slice(5) };
  if(!p.code || p.code==='不明'){          // 工務店コードが聞き取れなければ会社名から照合する
    const hit=lookupKoumuten(p.company);
    if(hit){ p.code=hit.c; p.codeFrom=hit.n; }
  }
  return p;
}

/* ===== 会社名 → 工務店コードの照合 =====
   ネオOMナビ/工務店コード検索を開いたときに保存された名簿(omk_dir)を使う */
const KS_NOISE_RE=/[\s　()（）株有限会社合同名事業協同組合・･.,、。／/\-ー–—~〜「」『』【】\[\]]+/g;
function ksKataToHira(s){ let o=''; for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); o+=(c>=0x30A1&&c<=0x30F6)?String.fromCharCode(c-0x60):s[i]; } return o; }
function ksNorm(t){ return t?ksKataToHira(t.normalize('NFKC').toLowerCase()).replace(KS_NOISE_RE,''):''; }
function ksBigrams(s){ if(s.length<2) return s?[s]:[]; const set={},out=[]; for(let i=0;i<s.length-1;i++){ const g=s.substr(i,2); if(!set[g]){set[g]=1;out.push(g);} } return out; }
function ksSim(a,b){ if(!a||!b) return 0; const A=ksBigrams(a),B=ksBigrams(b); if(!A.length||!B.length) return 0; const sb={}; B.forEach(function(g){sb[g]=1;}); let n=0; A.forEach(function(g){ if(sb[g]) n++; }); return 2*n/(A.length+B.length); }
let KS_DIR=null;
function loadDir(){
  if(KS_DIR) return KS_DIR;
  try{
    const raw=JSON.parse(localStorage.getItem('omk_dir')||'[]');
    KS_DIR=raw.map(function(d){ return {c:d.c, n:d.n, nn:ksNorm(d.n), kn:ksNorm(d.k)}; });
  }catch(e){ KS_DIR=[]; }
  return KS_DIR;
}
function lookupKoumuten(company){
  if(!company || company==='不明') return null;
  const dir=loadDir();
  if(!dir.length) return null;
  const q=ksNorm(company);
  if(!q) return null;
  let best=null, bestScore=0;
  for(let i=0;i<dir.length;i++){
    const d=dir[i];
    let s=0;
    if(d.nn===q) s=1;                              // 完全一致
    else if(d.nn.indexOf(q)===0||q.indexOf(d.nn)===0) s=0.9;   // 前方一致
    else if(d.nn.indexOf(q)>=0) s=0.8;             // 部分一致
    else s=Math.max(ksSim(q,d.nn), ksSim(q,d.kn)); // 似た名前
    if(s>bestScore){ bestScore=s; best=d; }
    if(s===1) break;
  }
  return (bestScore>=0.6) ? best : null;   // 確度が低いときは付けない(誤ったコードを防ぐ)
}
function fallbackSummary(list){
  const t=transcriptText(list);
  const first=((list[0]&&list[0].text)||'通話内容').slice(0,10);
  const phone=(function(){ const m=t.replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);}).match(/0\d[\d\-\s]{7,12}\d/); return m?m[0].replace(/\s/g,''):'不明'; })();
  const name=(function(){ const m=t.match(/([一-龥]{1,5})[ 　]?(?:と申します|と言います|といいます)/); return m?m[1]:'不明'; })();
  const bullets=list.slice(0,6).map(function(x){ return x.text; }).join('\n');
  return first+'\n'+name+'\n'+phone+'\n不明\n不明\n'+(bullets||'（内容なし）');
}
function showSummary(text, transcript){
  state.summaryText=text;
  state.transcriptAI=transcript||'';
  state.parsed=parseSummary(text);
}
/* AI応答を「要約」と「文字起こし全文」に分割(区切り行 ===)。見出し行(【…】)が混ざったら除去 */
function stripHeadings(s){
  return s.split('\n').filter(function(l){ return !/^\s*[【\[]?(前半|後半|区切り)?\s*[:：]?\s*(要約|文字起こし)\s*[】\]]?\s*$/.test(l) && !/^\s*【.*】\s*$/.test(l); }).join('\n').trim();
}
function splitAiResponse(text){
  const m=text.split(/\n\s*={3,}\s*\n/);
  return { summary:stripHeadings(m[0]||''), transcript:stripHeadings(m[1]||'') };
}
async function endCall(){
  if(!state.callActive){ showToast('通話中ではありません', true); return; }
  const snapshot={ transcript:state.transcript.slice(), startAt:state.callStartAt||new Date() };
  state.lastCall=snapshot;
  const blob=await stopActiveAndGetBlob();
  state.callActive=false;
  state.transcript=[]; state.callStartAt=null;
  state.energyL=0; state.energyR=0;
  if(state.timerId){ clearInterval(state.timerId); state.timerId=null; }
  stopRecognition();
  refreshStatus(); updateBanner();

  const recId = blob ? await saveRecording(blob) : null;  // 1週間保存
  state.lastRecId = recId;

  aiStatus.classList.remove('hidden');
  try{
    if(!blob) throw new Error(state.recDiag||'録音データなし');
    if(state.lastDurationMs < MIN_AUDIO_MS) throw new Error('録音が短すぎます('+Math.round(state.lastDurationMs/1000)+'秒)。通話開始の押し忘れの可能性があります');
    if(blob.size > MAX_AUDIO_MB*1024*1024) throw new Error('録音が長すぎます('+Math.round(blob.size/1048576)+'MB)');
    if(state.lastDurationMs > LONG_AUDIO_MS){
      const mins=Math.round(state.lastDurationMs/60000);
      aiStatus.classList.add('hidden');   // 確認中はスピナーを隠す
      if(!confirm('録音が'+mins+'分あります。AIの解析に数分かかる場合があります。\nこのままAI解析を続けますか？\n\n（キャンセルすると、AI解析はせずに録音の保存だけ行います）')){
        throw new Error('長時間のためAI解析をキャンセルしました');
      }
      aiStatus.classList.remove('hidden');
    }
    const b64=await blobToBase64(blob);
    const res=await fetch(WEBAPP_URL,{method:'POST',body:JSON.stringify({action:'summarize', mimeType: blob.type||'audio/webm', audio:b64})});
    const j=await res.json();
    if(!(j&&j.ok&&j.text)) throw new Error(j&&j.error?j.error:'AI応答エラー');
    const parts=splitAiResponse(j.text.trim());
    showSummary(parts.summary, parts.transcript||transcriptText(snapshot.transcript));
  }catch(e){
    console.warn('AI解析失敗→簡易要約に切替:', e);
    showSummary(fallbackSummary(snapshot.transcript), transcriptText(snapshot.transcript));
    showToast('AI解析に失敗。簡易要約を保存します（'+(e.message||e)+'）', true);
  }
  aiStatus.classList.add('hidden');
  await updateRecording(recId, {summary:state.summaryText, transcript:state.transcriptAI});  // 録音一覧に紐づけ
  openDetail(recId);   // 要約ができたら、その録音の要約・文字起こしを開いた状態にする
  await saveHistory();   // 要約完了と同時に自動で履歴保存
}

function clearCall(){
  state.callActive=false;
  state.transcript=[]; state.callStartAt=null; state.lastRowUrl='';
  state.summaryText=''; state.transcriptAI=''; state.parsed=null; state.lastCall=null; state.pendingSave=false;
  state.energyL=0; state.energyR=0;
  if(state.timerId){ clearInterval(state.timerId); state.timerId=null; }
  if(state.activeSeg){ discardSeg(state.activeSeg); state.activeSeg=null; }
  stopRecognition();
  aiStatus.classList.add('hidden');
  refreshStatus(); updateBanner();
}

function guessCategory(t){
  if(/(故障|壊れ|動かな|不具合|エラー|起動しな|つかな)/.test(t)) return '故障';
  if(/(クレーム|苦情|困っ|ひどい|最悪|怒|不満)/.test(t)) return 'クレーム';
  if(/(見積|金額|料金|価格|いくら|費用|お見積)/.test(t)) return '見積';
  if(/(要望|してほし|お願いしたい|希望|改善)/.test(t)) return '要望';
  return '質問';
}

function showToast(msg,isErr){ const t=$('toast'); t.textContent=msg; t.className='text-sm font-semibold self-center transition-opacity '+(isErr?'text-rose-600':'text-emerald-600'); t.style.opacity='1'; setTimeout(function(){t.style.opacity='0';},2600); }

async function saveHistory(){
  const agent=agentSelect.value;
  if(!agent){ state.pendingSave=true; showToast('担当者を選択すると自動で履歴保存されます', true); return null; }
  const call=state.lastCall||{ transcript:state.transcript, startAt:state.callStartAt };
  const trans=state.transcriptAI||transcriptText(call.transcript);   // シートには録音ベースの文字起こしを保存
  if(!trans && !state.summaryText){ showToast('保存する内容がありません', true); return null; }
  const p=state.parsed||{};
  const v=function(x){ return (x && x!=='不明') ? x : ''; };
  const payload={
    datetime:(call.startAt||new Date()).toLocaleString('ja-JP'),
    agent:agent,
    title:v(p.title), name:v(p.name), phone:v(p.phone), company:v(p.company), code:v(p.code),
    summary:(p.bullets||[]).join('\n'),   // 要約本文(タイトル等は各列へ)
    transcript:trans
  };
  try{
    const res=await fetch(WEBAPP_URL,{method:'POST',body:JSON.stringify(payload)});
    const j=await res.json();
    if(j&&j.ok&&j.url){ state.lastRowUrl=j.url; updateRecording(state.lastRecId,{url:j.url}); showToast('要約と履歴保存が完了しました'); return j.url; }
    showToast('保存はできましたが行URL取得に失敗', true); return null;
  }catch(e){ console.error(e); showToast('履歴保存に失敗（デプロイのアクセス権を確認）', true); return null; }
}

async function clip(text){ try{ await navigator.clipboard.writeText(text); }catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } }

async function refreshMySheetLink(){
  const agent=agentSelect.value;
  if(!agent){ mySheetLink.classList.add('hidden'); return; }
  try{
    const res=await fetch(WEBAPP_URL+'?agent='+encodeURIComponent(agent));
    const d=await res.json();
    if(d&&d.ok&&d.sheetUrl){ mySheetLink.href=d.sheetUrl; mySheetLink.textContent='📄 '+agent+' のシートを開く ↗'; mySheetLink.classList.remove('hidden'); }
    else mySheetLink.classList.add('hidden');
  }catch(e){ mySheetLink.classList.add('hidden'); }
}

/* 要約コピー: （項目）値 の列挙 + （要約）+ 文字起こしセルのURL */
function buildCopyText(rec){
  const p=parseSummary(rec.summary||'');
  const bullets=(p.bullets||[]).join('\n');
  return '（タイトル）'+(p.title||'')+'\n'+
    '（名前）'+(p.name||'')+'\n'+
    '（電話番号）'+(p.phone||'')+'\n'+
    '（会社名）'+(p.company||'')+'\n'+
    '（工務店コード）'+(p.code||'')+'\n'+
    '（要約）\n'+bullets+'\n\n'+
    '文字起こし: '+(rec.url||'（未保存のため未取得）');
}
startCallBtn.addEventListener('click', activateCall);
endCallBtn.addEventListener('click',endCall);
pauseBtn.addEventListener('click',togglePause);
clearBtn.addEventListener('click',clearCall);
overlayStartBtn.addEventListener('click',autoStart);
$('refreshDevices').addEventListener('click',listDevices);
deviceSelect.addEventListener('change',function(){ pauseCall(); if(state.activeSeg){ discardSeg(state.activeSeg); state.activeSeg=null; } try{ state.audioContext&&state.audioContext.close(); }catch(e){} state.audioContext=null; state.mediaStream=null; state.recognition=null; state.callActive=false; autoStart(); });
navigator.mediaDevices.addEventListener?.('devicechange',listDevices);

setStatus('idle'); listDevices(); refreshMySheetLink(); updateBanner(); autoStart();
purgeOldRecordings().then(renderRecList);
</script>
